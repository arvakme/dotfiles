# Lazygit popup. prefix + g
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Grok Build popup: prefix + y launch / prefix + u picker
# Pi stays in the main tmux session. prefix + t is clock-mode (tmux default).
unbind t
bind t clock-mode
bind y run-shell -b '~/.config/tmux/scripts/grok-launch.sh'
bind u run-shell -b '~/.config/tmux/scripts/grok-pick.sh'
