# Butler light — generated by ~/.config/theme/butler/generate.py from palette.json — edit the palette, not this file
# Same bubble layout as the previous Ayu/Catppuccin files; bg=default keeps the terminal glass.

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify absolute-centre
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 40

set -g status-style "fg=#797593,bg=default"
set -g status-bg default

set -g status-left "#[fg=#f2e9e1,bg=default]#[fg=#575279,bg=#f2e9e1,bold] #S:#I.#P #[fg=#f2e9e1,bg=default]"
set -g status-right "#[fg=#f2e9e1,bg=default]#[fg=#575279,bg=#f2e9e1] #h #[fg=#f2e9e1,bg=default]"

setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#797593,bg=default"
setw -g window-status-format "#[fg=#797593,bg=default]#[fg=#faf4ed,bg=#797593,bold] #I #[fg=#797593,bg=#f2e9e1]#[fg=#575279,bg=#f2e9e1] #W #[fg=#f2e9e1,bg=default]"
setw -g window-status-current-format "#[fg=#907aa9,bg=default]#[fg=#faf4ed,bg=#907aa9,bold] #I #[fg=#907aa9,bg=#dfdad9]#[fg=#575279,bg=#dfdad9] #W #[fg=#dfdad9,bg=default]"
setw -g window-status-activity-style "underscore,fg=#ea9d34,bg=default"

set -g mode-style "fg=#575279,bg=#dfdad9"
set -g message-style "fg=#575279,bg=#f2e9e1"
set -g message-command-style "fg=#907aa9,bg=#f2e9e1"
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#907aa9"
set -g clock-mode-colour "#907aa9"
set -g clock-mode-style 24
set -g display-panes-active-colour "#907aa9"
set -g display-panes-colour "#ea9d34"
