# Butler light — generated by ~/.config/theme/butler/generate.py from palette.json — edit the palette, not this file
# Same bubble layout as the previous Ayu/Catppuccin files; bg=default keeps the terminal glass.

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify absolute-centre
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 40

set -g status-style "fg=#797593,bg=default"
set -g status-bg default

set -g status-left "#[fg=#ebebf3,bg=default]#[fg=#575279,bg=#ebebf3,bold] #S:#I.#P #[fg=#ebebf3,bg=default]"
set -g status-right "#[fg=#ebebf3,bg=default]#[fg=#575279,bg=#ebebf3] #h #[fg=#ebebf3,bg=default]"

setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#797593,bg=default"
setw -g window-status-format "#[fg=#797593,bg=default]#[fg=#f5f5f8,bg=#797593,bold] #I #[fg=#797593,bg=#ebebf3]#[fg=#575279,bg=#ebebf3] #W #[fg=#ebebf3,bg=default]"
setw -g window-status-current-format "#[fg=#6a4bd0,bg=default]#[fg=#f5f5f8,bg=#6a4bd0,bold] #I #[fg=#6a4bd0,bg=#dcdce8]#[fg=#575279,bg=#dcdce8] #W #[fg=#dcdce8,bg=default]"
setw -g window-status-activity-style "underscore,fg=#ea9d34,bg=default"

set -g mode-style "fg=#575279,bg=#dcdce8"
set -g message-style "fg=#575279,bg=#ebebf3"
set -g message-command-style "fg=#6a4bd0,bg=#ebebf3"
set -g pane-border-style "fg=#cdcddd"
set -g pane-active-border-style "fg=#6a4bd0"
set -g clock-mode-colour "#6a4bd0"
set -g clock-mode-style 24
set -g display-panes-active-colour "#6a4bd0"
set -g display-panes-colour "#ea9d34"
