# Butler dark — generated by ~/.config/theme/butler/generate.py from palette.json — edit the palette, not this file
# Same bubble layout as the previous Ayu/Catppuccin files; bg=default keeps the terminal glass.

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify absolute-centre
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 40

set -g status-style "fg=#908caa,bg=default"
set -g status-bg default

set -g status-left "#[fg=#2a273f,bg=default]#[fg=#e0def4,bg=#2a273f,bold] #S:#I.#P #[fg=#2a273f,bg=default]"
set -g status-right "#[fg=#2a273f,bg=default]#[fg=#e0def4,bg=#2a273f] #h #[fg=#2a273f,bg=default]"

setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#908caa,bg=default"
setw -g window-status-format "#[fg=#908caa,bg=default]#[fg=#232136,bg=#908caa,bold] #I #[fg=#908caa,bg=#2a273f]#[fg=#e0def4,bg=#2a273f] #W #[fg=#2a273f,bg=default]"
setw -g window-status-current-format "#[fg=#c4a7e7,bg=default]#[fg=#232136,bg=#c4a7e7,bold] #I #[fg=#c4a7e7,bg=#44415a]#[fg=#e0def4,bg=#44415a] #W #[fg=#44415a,bg=default]"
setw -g window-status-activity-style "underscore,fg=#f6c177,bg=default"

set -g mode-style "fg=#e0def4,bg=#44415a"
set -g message-style "fg=#e0def4,bg=#2a273f"
set -g message-command-style "fg=#c4a7e7,bg=#2a273f"
set -g pane-border-style "fg=#56526e"
set -g pane-active-border-style "fg=#c4a7e7"
set -g clock-mode-colour "#c4a7e7"
set -g clock-mode-style 24
set -g display-panes-active-colour "#c4a7e7"
set -g display-panes-colour "#f6c177"
