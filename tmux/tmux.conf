# Tmux — craftzdog layout, Butler paint, terminal glass.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -s escape-time 10
setw -g mode-keys vi
set -g focus-events on
set -g set-clipboard on

unbind C-b
set -g prefix C-t
bind C-t send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind o run-shell "open '#{pane_current_path}'"
bind e kill-pane -a

bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# hjkl: also provided by tmux-pain-control. HJKL is *resize* there; do not
# rebind HJKL to swap-pane or you lose repeatable resize.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#T"

source-file ~/.config/tmux/themes/current.conf
if-shell "uname | grep -q Darwin" "source-file ~/.config/tmux/macos.conf"
source-file ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'

if-shell "[ -d ~/.tmux/plugins/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"

# After pain-control: it rebinds c to new-window. Ask for a name first.
unbind c
bind c command-prompt -p "name:" "new-window -n '%%' -c '#{pane_current_path}'"

# Pi/Butler: pass Shift+Enter and other modified keys through
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"
