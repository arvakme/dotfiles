onboarding = false

[keys]
prefix = "ctrl+t"

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

[terminal]
default_shell = "/bin/zsh"

# >>> butler theme (generated by ~/.config/theme/butler/generate.py; edit palette.json, not this block)
[theme]
name = "rose-pine-dawn"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[theme.custom.light]
accent = "#b9a6f3"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#d1cee6"
selection_bg = "#d1cee6"
surface0 = "#ebebf3"
surface1 = "#cdcddd"
surface_dim = "#272143"
overlay0 = "#5c3abe"
overlay1 = "#195c76"
text = "#3e395e"
subtext0 = "#155e69"
mauve = "#5c3abe"
green = "#195c76"
yellow = "#794b02"
red = "#883c53"
blue = "#155e69"
teal = "#155e69"
peach = "#893c3b"

[theme.custom.dark]
accent = "#b9a6f3"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#504b69"
selection_bg = "#504b69"
surface0 = "#2a273f"
surface1 = "#56526e"
surface_dim = "#232136"
overlay0 = "#ccbdfd"
overlay1 = "#81d1f4"
text = "#edecff"
subtext0 = "#8ed2de"
mauve = "#ccbdfd"
green = "#81d1f4"
yellow = "#f6c177"
red = "#feb1c2"
blue = "#8ed2de"
teal = "#8ed2de"
peach = "#feb3b0"
