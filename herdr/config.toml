onboarding = false

[keys]
prefix = "ctrl+t"

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

[terminal]
default_shell = "/bin/zsh"

# >>> butler theme (generated by ~/.config/theme/butler/generate.py; edit palette.json, not this block)
[theme]
name = "rose-pine-dawn"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[theme.custom.light]
accent = "#624d79"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#d7d0d4"
selection_bg = "#d7d0d4"
surface0 = "#f2e9e1"
surface1 = "#cecacd"
surface_dim = "#faf4ed"
overlay0 = "#624d79"
overlay1 = "#1a5d77"
text = "#3e395e"
subtext0 = "#175f6a"
mauve = "#624d79"
green = "#1a5d77"
yellow = "#7a4c04"
red = "#893d54"
blue = "#175f6a"
teal = "#175f6a"
peach = "#8b3e3c"

[theme.custom.dark]
accent = "#d7bafb"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#514b68"
selection_bg = "#514b68"
surface0 = "#2a273f"
surface1 = "#56526e"
surface_dim = "#232136"
overlay0 = "#d7bafb"
overlay1 = "#81d1f4"
text = "#edecff"
subtext0 = "#8ed2de"
mauve = "#d7bafb"
green = "#81d1f4"
yellow = "#f6c177"
red = "#feb1c2"
blue = "#8ed2de"
teal = "#8ed2de"
peach = "#feb3b0"
# <<< butler theme
