# Butler dark flavor — generated by ~/.config/theme/butler/generate.py from palette.json — edit the palette, not this file
# Icon colours stay on yazi's built-in dark preset; syntax colours come from tmtheme.xml next to this file.
#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#9ccfd8", bold = true }
find_keyword  = { fg = "#f6c177", bold = true, italic = true, underline = true }
find_position = { fg = "#eb6f92", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#aaa6c8", italic = true }
marker_copied   = { fg = "#3e8fb0",  bg = "#3e8fb0" }
marker_cut      = { fg = "#eb6f92", bg = "#eb6f92" }
marker_marked   = { fg = "#9ccfd8",  bg = "#9ccfd8" }
marker_selected = { fg = "#f6c177", bg = "#f6c177" }
count_copied   = { fg = "#232136", bg = "#3e8fb0" }
count_cut      = { fg = "#232136", bg = "#eb6f92" }
count_selected = { fg = "#232136", bg = "#f6c177" }
border_style = { fg = "#56526e" }

[tabs]
active   = { fg = "#232136", bg = "#b9a6f3", bold = true }
inactive = { fg = "#b9a6f3", bg = "#2a273f" }

[mode]
normal_main = { fg = "#232136", bg = "#b9a6f3", bold = true }
normal_alt  = { fg = "#b9a6f3", bg = "#2a273f" }
select_main = { fg = "#232136", bg = "#f6c177", bold = true }
select_alt  = { fg = "#f6c177", bg = "#2a273f" }
unset_main  = { fg = "#232136", bg = "#eb6f92", bold = true }
unset_alt   = { fg = "#eb6f92", bg = "#2a273f" }

[indicator]
parent  = { fg = "#e0def4", bg = "#44415a" }
current = { fg = "#e0def4", bg = "#44415a", bold = true }
preview = { fg = "#e0def4", bg = "#44415a" }

[status]
overall   = { fg = "#aaa6c8" }
perm_sep   = { fg = "#9490b3" }
perm_type  = { fg = "#3e8fb0" }
perm_read  = { fg = "#f6c177" }
perm_write = { fg = "#eb6f92" }
perm_exec  = { fg = "#b9a6f3" }
progress_label  = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#b9a6f3", bg = "#2a273f" }
progress_error  = { fg = "#eb6f92", bg = "#2a273f" }

[which]
border          = { fg = "#9ccfd8" }
mask            = { bg = "#2a283e" }
cand            = { fg = "#b9a6f3" }
rest            = { fg = "#9490b3" }
desc            = { fg = "#aaa6c8" }
separator_style = { fg = "#56526e" }

[confirm]
border  = { fg = "#9ccfd8" }
title   = { fg = "#9ccfd8", bold = true }
body    = { fg = "#e0def4" }
list    = { fg = "#aaa6c8" }
btn_yes = { fg = "#232136", bg = "#b9a6f3", bold = true }
btn_no  = { fg = "#aaa6c8" }

[spot]
border   = { fg = "#9ccfd8" }
title    = { fg = "#9ccfd8", bold = true }
tbl_col  = { fg = "#b9a6f3" }
tbl_cell = { fg = "#e0def4", bg = "#44415a" }

[notify]
title_info  = { fg = "#3e8fb0" }
title_warn  = { fg = "#f6c177" }
title_error = { fg = "#eb6f92" }

[pick]
border   = { fg = "#9ccfd8" }
active   = { fg = "#9ccfd8", bg = "#44415a", bold = true }
inactive = { fg = "#e0def4" }

[input]
border   = { fg = "#9ccfd8" }
title    = { fg = "#9ccfd8" }
value    = { fg = "#e0def4" }
selected = { bg = "#44415a" }

[cmp]
border   = { fg = "#9ccfd8" }
active   = { fg = "#9ccfd8", bg = "#44415a" }
inactive = { fg = "#e0def4" }

[tasks]
border  = { fg = "#9ccfd8" }
title   = { fg = "#9ccfd8" }
hovered = { fg = "#9ccfd8", bg = "#44415a", bold = true }

[help]
border  = { fg = "#9ccfd8" }
chord   = { fg = "#b9a6f3" }
action  = { fg = "#e0def4" }
hovered = { fg = "#9ccfd8", bg = "#44415a", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#f6c177" },
	{ mime = "**/{audio,video}/*", fg = "#aaa6c8" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#eb6f92" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#b9a6f3" },
	{ mime = "vfs/{absent,stale}", fg = "#9490b3" },
	{ url = "*", is = "orphan", fg = "#232136", bg = "#eb6f92" },
	{ url = "*", is = "exec", fg = "#3e8fb0" },
	{ url = "*", is = "dummy", fg = "#232136", bg = "#eb6f92" },
	{ url = "*/", is = "dummy", fg = "#232136", bg = "#eb6f92" },
	{ url = "*/", fg = "#9ccfd8", bold = true },
	{ url = "*", fg = "#e0def4" },
]
